[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alz-rag-agent"
version = "0.1.0"
description = "RAS prototype for Alzheimer's therapeutic target discovery"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AI Engineer" }]
dependencies = [
  "accelerate>=0.33.0",
  "bitsandbytes>=0.43.1",
  "faiss-cpu>=1.8.0",
  "langchain>=0.3.10",
  "langchain-community>=0.3.10",
  "langchain-huggingface>=0.1.2",
  "langchain-text-splitters>=0.3.2",
  "matplotlib>=3.8.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "pyarrow>=17.0.0",
  "pymed>=0.8.9",
  "requests>=2.32.0",
  "seaborn>=0.13.2",
  "sentence-transformers>=3.0.1",
  "streamlit>=1.37.0",
  "torch>=2.3.0",
  "transformers>=4.44.0",
  "wordcloud>=1.9.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
